spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: AdegaDoPaiBackend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    locations: classpath:db/migration
    sql-migration-prefix: V

# Configuração do Mercado Pago adicionada aqui na raiz
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-url: ${MERCADOPAGO_WEBHOOK_URL:http://localhost:8080/api/v1/payments/webhook}
  frontend-success-url: ${MERCADOPAGO_FRONTEND_SUCCESS_URL:http://localhost:4200/checkout/sucesso}
  frontend-failure-url: ${MERCADOPAGO_FRONTEND_FAILURE_URL:http://localhost:4200/checkout/falha}
  frontend-pending-url: ${MERCADOPAGO_FRONTEND_PENDING_URL:http://localhost:4200/checkout/pendente}
  use-sandbox-checkout-url: ${MERCADOPAGO_USE_SANDBOX_CHECKOUT_URL:true}

api:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:60000}
    api:
      max-requests: ${API_RATE_LIMIT_MAX_REQUESTS:120}
      window-ms: ${API_RATE_LIMIT_WINDOW_MS:60000}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:OFF}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_SQL_BINDER_LOG_LEVEL:OFF}